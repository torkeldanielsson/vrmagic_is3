[package]
name = "vrmagic-is3"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Control VRmagic IS3 cameras, feed their watchdog and deliver RTP video"
repository = "https://github.com/torkeldanielsson/vrmagic_is3"
readme = "README.md"

[[bin]]
name = "is3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
