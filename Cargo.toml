[package]
name = "vrmagic-is3"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Control VRmagic IS3 cameras, feed their watchdog and deliver RTP video"
repository = "https://github.com/torkeldanielsson/vrmagic_is3"
readme = "README.md"

[[bin]]
name = "is3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
netdev = { version = "0.46", default-features = false }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
libloading = "0.9"

[profile.release]
strip = true
